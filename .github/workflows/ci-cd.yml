name: CI/CD Pipeline

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [develop, main]

permissions:
  contents: write
  actions: read
  checks: write
  issues: write
  pull-requests: write
  security-events: write

jobs:
  unit_tests:
    name: Unit Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build packages
        run: npx lerna run build

      - name: Run ESLint (type check)
        run: npm run lint
        continue-on-error: true

      - name: Security Audit (npm)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        if: matrix.node-version == '20.x'
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-results.sarif'
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        continue-on-error: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: matrix.node-version == '20.x' && (success() || failure())
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Run Tests
        run: npm test

  publish:
    name: Publish
    needs: unit_tests
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build packages
        run: npx lerna run build

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME=${{ github.ref_name }}
          VERSION=${TAG_NAME#v}  # Remove 'v' prefix
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Determine release type
        id: release-type
        run: |
          if [[ ${{ steps.version.outputs.version }} == *"beta"* ]]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          elif [[ ${{ steps.version.outputs.version }} == *"alpha"* ]]; then
            echo "tag=alpha" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine diff base for beta/alpha
        if: steps.release-type.outputs.prerelease == 'true'
        id: beta-diff-base
        run: |
          CURRENT_TAG=${{ github.ref_name }}
          RELEASE_TYPE=${{ steps.release-type.outputs.tag }}

          if [ "$RELEASE_TYPE" = "beta" ]; then
            PREVIOUS_TAG=$(git tag -l "v*-beta*" | grep -v "^${CURRENT_TAG}$" | sort -V | tail -1)
          elif [ "$RELEASE_TYPE" = "alpha" ]; then
            PREVIOUS_TAG=$(git tag -l "v*-alpha*" | grep -v "^${CURRENT_TAG}$" | sort -V | tail -1)
          fi

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "diff_base=develop" >> $GITHUB_OUTPUT
          else
            echo "diff_base=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Determine diff base for production
        if: steps.release-type.outputs.prerelease == 'false'
        id: prod-diff-base
        run: |
          CURRENT_TAG=${{ github.ref_name }}
          LAST_PROD=$(git tag -l "v*.*.*" | grep -v -E "(alpha|beta|rc)" | grep -v "^${CURRENT_TAG}$" | sort -V | tail -1)
          if [ -z "$LAST_PROD" ]; then
            echo "diff_base=main" >> $GITHUB_OUTPUT
          else
            echo "diff_base=$LAST_PROD" >> $GITHUB_OUTPUT
          fi

      - name: Check for changes (Beta/Alpha)
        if: steps.release-type.outputs.prerelease == 'true'
        id: beta-changes
        run: |
          DIFF_BASE="${{ steps.beta-diff-base.outputs.diff_base }}"
          if git rev-parse "$DIFF_BASE" >/dev/null 2>&1; then
            CHANGED_PACKAGES_LIST=$(npx lerna list --since="$DIFF_BASE" --json 2>/dev/null || echo "[]")
            CHANGED_PACKAGES=$(echo "$CHANGED_PACKAGES_LIST" | jq length)
            PACKAGES_JSON=$(echo "$CHANGED_PACKAGES_LIST" | jq -c '.' || echo "[]")
            echo "packages=$PACKAGES_JSON" >> $GITHUB_OUTPUT
          else
            CHANGED_PACKAGES=1
            echo "packages=[]" >> $GITHUB_OUTPUT
          fi
          echo "changed_count=$CHANGED_PACKAGES" >> $GITHUB_OUTPUT

      - name: Check for changes (Production)
        if: steps.release-type.outputs.prerelease == 'false'
        id: prod-changes
        run: |
          DIFF_BASE="${{ steps.prod-diff-base.outputs.diff_base }}"
          if git rev-parse "$DIFF_BASE" >/dev/null 2>&1; then
            CHANGED_PACKAGES_LIST=$(npx lerna list --since="$DIFF_BASE" --json 2>/dev/null || echo "[]")
            CHANGED_PACKAGES=$(echo "$CHANGED_PACKAGES_LIST" | jq length)
            PACKAGES_JSON=$(echo "$CHANGED_PACKAGES_LIST" | jq -c '.' || echo "[]")
            echo "packages=$PACKAGES_JSON" >> $GITHUB_OUTPUT
          else
            CHANGED_PACKAGES=1
            echo "packages=[]" >> $GITHUB_OUTPUT
          fi
          echo "changed_count=$CHANGED_PACKAGES" >> $GITHUB_OUTPUT

      - name: Publish to npm (Beta/Alpha)
        if: steps.release-type.outputs.prerelease == 'true' && steps.beta-changes.outputs.changed_count != '0'
        run: |
          git checkout -b temp-publish-${{ github.run_id }}
          npx lerna version ${{ steps.version.outputs.version }} --yes --no-git-tag-version --no-push --exact --force-publish --amend
          git add -A
          git commit -m "chore: version packages for release" || echo "No changes to commit"
          # Lerna v9+ uses npm OIDC trusted publishing (requires id-token: write and npm >= 11.5.1)
          npx lerna publish from-package --yes --dist-tag ${{ steps.release-type.outputs.tag }} --no-git-tag-version --no-push

      - name: Publish to npm (Production)
        if: steps.release-type.outputs.prerelease == 'false' && steps.prod-changes.outputs.changed_count != '0'
        run: |
          git checkout -b temp-publish-${{ github.run_id }}
          npx lerna version ${{ steps.version.outputs.version }} --yes --no-git-tag-version --no-push --exact --force-publish --amend
          git add -A
          git commit -m "chore: version packages for release" || echo "No changes to commit"
          # Lerna v9+ uses npm OIDC trusted publishing (requires id-token: write and npm >= 11.5.1)
          npx lerna publish from-package --yes --no-git-tag-version --no-push

      - name: Skip publish (no changes)
        if: |
          (steps.release-type.outputs.prerelease == 'true' && steps.beta-changes.outputs.changed_count == '0') ||
          (steps.release-type.outputs.prerelease == 'false' && steps.prod-changes.outputs.changed_count == '0')
        run: |
          echo "No changes detected for this release type. Skipping npm publish."
          echo "This is normal behavior - packages are only published when there are actual code changes."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ steps.release-type.outputs.prerelease }}
          body: |
            ## Changes
            See the [CHANGELOG](./CHANGELOG.md) for details.

            ## Installation
            ```bash
            npm install @mbc-cqrs-serverless/master-web@${{ steps.release-type.outputs.tag }}
            npm install @mbc-cqrs-serverless/survey-web@${{ steps.release-type.outputs.tag }}
            ```
          token: ${{ secrets.GITHUB_TOKEN }}
